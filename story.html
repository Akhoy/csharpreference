<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kettle Storybook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one scene per screen. Title, stage (animated 640×360 SVG), one caption line, controls.
   Same palette and faces as the book, so the storybook and the chapters read as one product. */
:root {
  --bg: #f5f6f9; --paper: #ffffff; --sunken: #eef0f5; --ink: #171b26; --ink-2: #3a4152; --muted: #646c7e; --line: #cfd4df;
  --accent: #512bd4; --accent-soft: #eee9fe; --accent-ink: #ffffff;
  --ok: #1f7a52; --ok-soft: #e2f3ea; --bad: #c03a46; --bad-soft: #fbe4e6; --warn: #a86a06; --warn-soft: #fbefd8;
  --why: #2457c5; --why-soft: #e8eefc; --code-bg: #1b1f2b; --code-ink: #e7e9f0; --code-hl: #3a3170;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0f15; --paper: #151821; --sunken: #1b1f2b; --ink: #e7e9f0; --ink-2: #c4c9d6; --muted: #959db0; --line: #353b4c;
    --accent: #a993ff; --accent-soft: #262046; --accent-ink: #160d38;
    --ok: #4cc58a; --ok-soft: #12301f; --bad: #f0727b; --bad-soft: #3a1a1e; --warn: #e6a83a; --warn-soft: #33270d;
    --why: #7ea6ff; --why-soft: #18233d; --code-bg: #0a0c12; --code-ink: #e7e9f0; --code-hl: #33295e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0f15; --paper: #151821; --sunken: #1b1f2b; --ink: #e7e9f0; --ink-2: #c4c9d6; --muted: #959db0; --line: #353b4c;
  --accent: #a993ff; --accent-soft: #262046; --accent-ink: #160d38;
  --ok: #4cc58a; --ok-soft: #12301f; --bad: #f0727b; --bad-soft: #3a1a1e; --warn: #e6a83a; --warn-soft: #33270d;
  --why: #7ea6ff; --why-soft: #18233d; --code-bg: #0a0c12; --code-ink: #e7e9f0; --code-hl: #33295e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--f-body); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
code { font-variant-ligatures: none; font-family: var(--f-mono); font-size: .88em; background: var(--sunken); padding: .08em .35em; border-radius: 5px; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-in { max-width: 960px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 9px; font: 700 17px/1 var(--f-display); color: var(--ink); text-decoration: none; background: none; border: 0; padding: 0; }
.mark { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font: 800 13px/1 var(--f-display); }
.prog { margin-left: auto; font: 500 13px/1 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.btn { border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 7px 12px; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn[disabled] { opacity: .4; cursor: default; }

main { padding-block: 22px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 960px; margin: 0 auto; }

/* map */
.hero { display: grid; gap: 10px; margin: 6px 0 26px; }
.hero h1 { font: 800 clamp(30px, 5.4vw, 50px)/1.05 var(--f-display); margin: 0; letter-spacing: -.02em; text-wrap: balance; }
.hero p { margin: 0; color: var(--ink-2); max-width: 60ch; font-size: 17px; }
.hero .go { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
.part { margin-top: 26px; }
.part h2 { font: 700 13px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; display: flex; gap: 10px; align-items: baseline; }
.part h2 b { color: var(--accent); font-weight: 600; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.tile { text-align: left; border: 1px solid var(--line); background: var(--paper); border-radius: 12px; padding: 11px 13px; display: grid; gap: 3px; min-width: 0; }
.tile:hover { border-color: var(--accent); }
.tile .n { font: 500 12px/1 var(--f-mono); color: var(--muted); display: flex; justify-content: space-between; }
.tile .n .seen { color: var(--ok); }
.tile .t { font: 700 16px/1.25 var(--f-display); }
.tile .h { font-size: 13px; line-height: 1.4; color: var(--muted); }

/* scene */
.eyebrow { font: 600 12px/1 var(--f-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.eyebrow b { color: var(--accent); font-weight: 600; }
.scene h1 { font: 800 clamp(26px, 4.4vw, 40px)/1.08 var(--f-display); margin: 8px 0 4px; letter-spacing: -.015em; text-wrap: balance; }
.hook { margin: 0 0 14px; color: var(--ink-2); font-size: 16px; }
.hook::before { content: "Problem · "; font: 600 12px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--bad); }
.stage { margin: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; touch-action: pan-y; }
.stage svg { display: block; width: 100%; height: auto; }
.cap { min-height: 4.6em; margin: 14px 2px 6px; display: grid; gap: 6px; align-content: start; }
.cap p { margin: 0; font-size: clamp(17px, 2.2vw, 20px); line-height: 1.45; max-width: 62ch; text-wrap: pretty; }
.badge { justify-self: start; font: 600 11px/1 var(--f-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 5px 8px; border-radius: 6px; }
.cap p.fade { animation: capIn .45s ease both; }
@keyframes capIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.ctl { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.dots { display: flex; gap: 6px; align-items: center; flex: 1; min-width: 0; }
.dots button { width: 26px; height: 26px; border: 0; background: none; padding: 0; display: grid; place-items: center; }
.dots button::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--line); transition: background .3s, transform .3s; }
.dots button.on::before { background: var(--accent); transform: scale(1.35); }
.dots button.pro::before { border-radius: 2px; }
.key { margin: 16px 0 0; padding: 12px 14px; border-radius: 12px; background: var(--ok-soft); color: var(--ink); font-weight: 500; }
.key::before { content: "Remember · "; font: 600 12px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ok); }
.pager { display: flex; gap: 10px; justify-content: space-between; align-items: center; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.pager .mid { order: 0; }
.hint { color: var(--muted); font-size: 13px; margin-top: 10px; }

/* SVG actors */
svg .sh { fill: var(--paper); stroke: var(--line); stroke-width: 1.6; transition: fill .45s, stroke .45s, stroke-width .3s; }
svg .lbl { fill: var(--ink); font: 600 14px var(--f-body); text-anchor: middle; dominant-baseline: middle; transition: fill .45s; }
svg .sub { fill: var(--muted); font: 400 11.5px var(--f-mono); text-anchor: middle; dominant-baseline: middle; }
svg .pill .lbl { font: 500 13px var(--f-body); }
svg .dot .lbl { font: 700 10.5px var(--f-mono); }
svg .user .lbl { font: 500 12.5px var(--f-body); }
svg .zone rect { fill: var(--sunken); stroke: var(--line); stroke-dasharray: 5 5; stroke-width: 1.4; opacity: .7; }
svg .zt { fill: var(--muted); font: 600 11px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; }
svg .tx { fill: var(--ink-2); font: 500 14px var(--f-body); text-anchor: middle; dominant-baseline: middle; }
svg .tx.mono { font-family: var(--f-mono); font-size: 12.5px; }
svg .tx.big { font: 800 22px var(--f-display); fill: var(--ink); }
svg .codebg { fill: var(--code-bg); }
svg .cl { fill: var(--code-ink); font: 400 12.5px var(--f-mono); font-variant-ligatures: none; dominant-baseline: middle; white-space: pre; }
svg .clh { fill: var(--code-hl); opacity: 0; transition: opacity .35s; }
svg .clh.on { opacity: 1; }
svg .actor { transition: transform .75s cubic-bezier(.45,0,.2,1), opacity .5s; }
svg .actor > g { transition: transform .5s cubic-bezier(.45,0,.2,1); }
svg .dot .sh { fill: var(--accent); stroke: var(--accent); }
svg .dot .lbl { fill: var(--accent-ink); }
svg [data-c="acc"] .sh { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
svg [data-c="ok"] .sh { fill: var(--ok-soft); stroke: var(--ok); stroke-width: 2; }
svg [data-c="bad"] .sh { fill: var(--bad-soft); stroke: var(--bad); stroke-width: 2; }
svg [data-c="warn"] .sh { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 2; }
svg [data-c="why"] .sh { fill: var(--why-soft); stroke: var(--why); stroke-width: 2; }
svg [data-c="mute"] .sh { fill: var(--sunken); stroke-dasharray: 4 4; }
svg [data-c="mute"] .lbl { fill: var(--muted); }
svg .dot[data-c="ok"] .sh { fill: var(--ok); stroke: var(--ok); }
svg .dot[data-c="bad"] .sh { fill: var(--bad); stroke: var(--bad); }
svg .dot[data-c="warn"] .sh { fill: var(--warn); stroke: var(--warn); }
svg .dot[data-c="why"] .sh { fill: var(--why); stroke: var(--why); }
svg .dot[data-c="mute"] .sh { fill: var(--muted); stroke: var(--muted); }
svg .arr path { fill: none; stroke: var(--muted); stroke-width: 1.7; }
svg .arr.dash path { stroke-dasharray: 5 5; }
svg .arr[data-c="acc"] path { stroke: var(--accent); stroke-width: 2.2; }
svg .arr[data-c="ok"] path { stroke: var(--ok); stroke-width: 2.2; }
svg .arr[data-c="bad"] path { stroke: var(--bad); stroke-width: 2.2; }
svg .arr[data-c="warn"] path { stroke: var(--warn); stroke-width: 2.2; }
svg .arr[data-c="why"] path { stroke: var(--why); stroke-width: 2.2; }
svg .arr text { fill: var(--ink-2); font: 500 11.5px var(--f-mono); text-anchor: middle; dominant-baseline: middle; paint-order: stroke; stroke: var(--paper); stroke-width: 5px; stroke-linejoin: round; }
svg .arr { transition: opacity .5s; }
svg marker path { stroke: none; }
svg #ah-, svg #ah-mute { fill: var(--muted); }
svg #ah-acc { fill: var(--accent); } svg #ah-ok { fill: var(--ok); } svg #ah-bad { fill: var(--bad); }
svg #ah-warn { fill: var(--warn); } svg #ah-why { fill: var(--why); }
@media (prefers-reduced-motion: reduce) {
  svg .actor, svg .actor > g, svg .sh, svg .arr { transition: none !important; }
  .cap p.fade { animation: none; }
}
@media (max-width: 560px) {
  .stage { margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); border-radius: 0; border-left: 0; border-right: 0; }
  .hint { display: none; }
  .prog { display: none; }
  .brand span:last-child { display: none; }
}
</style>
</head>
<body>
<header class="bar"><div class="bar-in">
  <button class="brand" id="home" type="button" aria-label="Story map"><span class="mark">K</span><span>Kettle Storybook</span></button>
  <span class="prog" id="prog"></span>
  <button class="btn" id="mapBtn" type="button">Map</button>
  <a class="btn" id="bookBtn" href="index.html">Full book</a>
</div></header>
<main><div class="wrap" id="app"></div></main>
<script src="assets/story/parts.js"></script>
<script src="assets/story/s1-platform.js"></script>
<script src="assets/story/s2-language.js"></script>
<script src="assets/story/s3-aspnet.js"></script>
<script src="assets/story/s4-data-arch.js"></script>
<script src="assets/story/s5-distributed-cloud.js"></script>
<script src="assets/story/s6-perf-security.js"></script>
<script src="assets/story/engine.js"></script>
</body>
</html>
