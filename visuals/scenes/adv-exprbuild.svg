<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="Building an expression tree from filter rows chosen at runtime, then compiling it or handing it to EF Core to become parameterised SQL">
<defs><marker id="eb-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-acc"/></marker></defs>
<text class="t-cap" x="24" y="28">ADMIN SCREEN: FILTERS CHOSEN AT RUNTIME</text>
<rect x="24" y="40" width="250" height="34" rx="6" class="b" data-hl="2"/><text class="t-c" x="36" y="62" style="font-size:12px">Total     &gt;    50</text>
<rect x="24" y="82" width="250" height="34" rx="6" class="b" data-hl="2"/><text class="t-c" x="36" y="104" style="font-size:12px">Country   =    "GB"</text>
<text class="t-m" x="24" y="136" data-s="1-1">The user picks the fields. You can't write a lambda for every combination.</text>
<g data-s="2" class="fly-r"><path d="M274,80 L306,80" class="ln-acc" marker-end="url(#eb-a)"/>
<rect x="312" y="40" width="160" height="32" rx="6" class="b-info"/><text class="t-c" x="322" y="61" style="font-size:11px">Property(o, "Total")</text>
<rect x="312" y="80" width="160" height="32" rx="6" class="b-info"/><text class="t-c" x="322" y="101" style="font-size:11px">Constant(50m)</text>
<rect x="480" y="58" width="130" height="32" rx="6" class="b-acc"/><text class="t-c" x="490" y="79" style="font-size:11px">GreaterThan</text>
<text class="t-m" x="312" y="136">each row becomes a few nodes</text></g>
<g data-s="3" class="fly"><rect x="312" y="150" width="384" height="40" rx="8" class="b-acc" style="stroke-width:2.5"/><text class="t-c" x="324" y="175" style="font-size:12px">o =&gt; o.Total &gt; 50 &amp;&amp; o.Country == "GB"</text>
<text class="t-m" x="312" y="208">rows joined with AndAlso: ONE Expression&lt;Func&lt;Order,bool&gt;&gt;</text></g>
<g data-s="4"><rect x="24" y="226" width="320" height="70" rx="8" class="b-good"/><text class="t-cap" x="36" y="246">.Compile() → A DELEGATE</text><text class="t-s" x="36" y="268">filter in-memory lists</text>
<rect x="376" y="226" width="320" height="70" rx="8" class="b-good"/><text class="t-cap" x="388" y="246">db.Orders.Where(tree) → EF CORE</text><text class="t-c" x="388" y="270" style="font-size:11px">WHERE Total &gt; @p0 AND Country = @p1</text></g>
<g data-s="5"><rect x="24" y="226" width="672" height="70" rx="8" class="b-bad"/><text class="t-s t-bad" x="36" y="250">The alternative, "WHERE " + userInput, is SQL injection waiting to happen.</text><text class="t-s" x="36" y="274">In a tree, whatever the user typed is only ever a Constant node, sent as a parameter.</text></g>
</svg>
