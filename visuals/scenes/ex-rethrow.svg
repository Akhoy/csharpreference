<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="throw; keeps the stack trace that points at the real failure; throw ex; replaces it with the catch line; wrapping keeps the original as InnerException">
<text class="t-cap" x="24" y="28">THE STACK TRACE: WHERE THE ERROR CAME FROM</text>
<rect x="24" y="44" width="330" height="100" rx="10" class="b-sunk"/>
<text class="t-c" x="36" y="68" style="font-size:12px">Checkout()</text><text class="t-c" x="52" y="90" style="font-size:12px">catch (Exception ex) { log; … }</text><text class="t-c" x="68" y="112" style="font-size:12px">ChargeCard()  ← failed HERE</text>
<g data-s="1-1"><rect x="380" y="44" width="316" height="100" rx="10" class="b-bad"/><text class="t-cap" x="392" y="66">InvalidOperationException</text><text class="t-c" x="392" y="90" style="font-size:11.5px">at ChargeCard()   line 31</text><text class="t-c" x="392" y="110" style="font-size:11.5px">at Checkout()     line 12</text>
<text class="t-s" x="24" y="176">ChargeCard throws. The exception records the path it took: the stack trace.</text><text class="t-s" x="24" y="196">Checkout catches it to log it, and then needs to pass it on.</text></g>
<g data-s="2-2"><rect x="380" y="44" width="316" height="100" rx="10" class="b-good"/><text class="t-cap" x="392" y="66">after  throw;</text><text class="t-c t-good" x="392" y="90" style="font-size:11.5px">at ChargeCard()   line 31  ✓</text><text class="t-c" x="392" y="110" style="font-size:11.5px">at Checkout()     line 12</text>
<text class="t-s t-good" x="24" y="176">throw; passes on the SAME exception, untouched.</text><text class="t-s t-good" x="24" y="196">The trace still points at line 31, where it really failed.</text></g>
<g data-s="3-3"><rect x="380" y="44" width="316" height="100" rx="10" class="b-bad"/><text class="t-cap" x="392" y="66">after  throw ex;</text><text class="t-c t-m" x="392" y="90" style="font-size:11.5px;text-decoration:line-through">at ChargeCard()   line 31</text><text class="t-c t-bad" x="392" y="110" style="font-size:11.5px">at Checkout()     line 14  ✗</text>
<text class="t-s t-bad" x="24" y="176">throw ex; treats it as a NEW throw from inside the catch. The trace now starts at</text><text class="t-s t-bad" x="24" y="196">line 14, the catch block. The real origin is gone, and so is your clue.</text></g>
<g data-s="4"><rect x="380" y="44" width="316" height="120" rx="10" class="b-info"/><text class="t-cap" x="392" y="66">throw new PaymentException("…", ex)</text><text class="t-c" x="392" y="90" style="font-size:11.5px">PaymentException: Checkout of</text><text class="t-c" x="392" y="108" style="font-size:11.5px">  order 42 failed</text><text class="t-c t-good" x="392" y="132" style="font-size:11.5px">  InnerException: at ChargeCard() ✓</text>
<text class="t-s t-info" x="24" y="196">Wrapping: a new exception that explains what you were doing, with the original</text><text class="t-s t-info" x="24" y="216">kept inside as InnerException. Clearer message, nothing lost.</text></g>
</svg>
