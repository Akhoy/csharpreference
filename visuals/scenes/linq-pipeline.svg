<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-label="A LINQ query is a pipeline that does nothing until foreach pulls items through it one at a time">
<defs><marker id="lp-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-m"/></marker></defs>
<text class="t-cap" x="24" y="26">orders</text><text class="t-cap" x="150" y="26">.Where(paid)</text><text class="t-cap" x="300" y="26">.Select(total)</text><text class="t-cap" x="450" y="26">.Take(2)</text><text class="t-cap" x="612" y="26">foreach</text>
<rect x="24" y="40" width="104" height="40" rx="6" class="b"/><text class="t-c" x="34" y="57" style="font-size:12px">#1</text><text class="t-m" x="34" y="73" style="font-size:11px">unpaid</text>
<rect x="24" y="90" width="104" height="40" rx="6" class="b"/><text class="t-c" x="34" y="107" style="font-size:12px">#2</text><text class="t-m" x="34" y="123" style="font-size:11px">paid £30</text>
<rect x="24" y="140" width="104" height="40" rx="6" class="b"/><text class="t-c" x="34" y="157" style="font-size:12px">#3</text><text class="t-m" x="34" y="173" style="font-size:11px">paid £12</text>
<rect x="24" y="190" width="104" height="40" rx="6" class="b"/><text class="t-c" x="34" y="207" style="font-size:12px">#4</text><text class="t-m" x="34" y="223" style="font-size:11px">paid £50</text>
<rect x="24" y="240" width="104" height="40" rx="6" class="b"/><text class="t-c" x="34" y="257" style="font-size:12px">#5</text><text class="t-m" x="34" y="273" style="font-size:11px">unpaid</text>
<rect x="150" y="120" width="120" height="60" rx="10" class="b-acc"/><text class="t-s" x="210" y="168" text-anchor="middle">keep if paid</text>
<rect x="300" y="120" width="120" height="60" rx="10" class="b-acc"/><text class="t-s" x="360" y="168" text-anchor="middle">order → £total</text>
<rect x="450" y="120" width="120" height="60" rx="10" class="b-acc"/><text class="t-s" x="510" y="168" text-anchor="middle">stop after 2</text>
<path d="M128,150 L146,150" class="ln-m" marker-end="url(#lp-ar)"/><path d="M270,150 L296,150" class="ln-m" marker-end="url(#lp-ar)"/><path d="M420,150 L446,150" class="ln-m" marker-end="url(#lp-ar)"/><path d="M570,150 L604,150" class="ln-m" marker-end="url(#lp-ar)"/>
<rect x="610" y="40" width="96" height="240" rx="10" class="b-sunk"/>
<text class="t-s t-acc" x="150" y="230" data-s="1-1">Nothing has run yet. The query is only a plan: a recipe, not a meal.</text>
<g data-s="2-2" data-mv="2:134,74"><rect x="34" y="46" width="84" height="28" rx="14" class="b-bad"/><text class="t-c" x="76" y="65" text-anchor="middle" style="font-size:12px">#1 ✗</text></g>
<text class="t-s t-bad" x="150" y="230" data-s="2-2">foreach asks for an item. Where pulls #1: unpaid, so it's dropped.</text>
<g data-s="3" data-mv="3:582,-40"><rect x="34" y="96" width="84" height="28" rx="14" class="b-good"/><text class="t-c" x="76" y="115" text-anchor="middle" style="font-size:12px">£30</text></g>
<text class="t-s t-good" x="150" y="230" data-s="3-3">Where pulls #2: paid. Select turns it into £30. Take passes it on.</text>
<g data-s="4" data-mv="4:582,-50"><rect x="34" y="146" width="84" height="28" rx="14" class="b-good"/><text class="t-c" x="76" y="165" text-anchor="middle" style="font-size:12px">£12</text></g>
<g data-s="4-4"><text class="t-s t-good" x="150" y="230">#3 → £12. Take has its 2, so the pipeline STOPS.</text><rect x="22" y="188" width="108" height="94" rx="8" fill="none" class="ln-m" style="stroke:var(--c-gotcha);stroke-dasharray:4 3"/><text class="t-s t-warn" x="150" y="252">#4 and #5 were never even read.</text></g>
<g data-s="5"><text class="t-s t-warn" x="150" y="230">Loop over the same query again and ALL of this runs again,</text><text class="t-s t-warn" x="150" y="250">from the start. A query stores no results. Use .ToList() to keep them.</text></g>
<text class="t-m" x="24" y="312">Items flow one at a time. Each stage pulls from the one before it only when asked.</text>
</svg>
