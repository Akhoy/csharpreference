<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="A property looks like a field but the compiler turns it into get and set methods, so the setter can check values">
<defs><marker id="op-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-acc"/></marker></defs>
<text class="t-cap" x="24" y="28">WHAT YOU WRITE</text><text class="t-cap" x="390" y="28">WHAT THE COMPILER MAKES OF IT</text>
<rect x="24" y="44" width="330" height="40" rx="6" class="b" data-hl="1,3"/><text class="t-c" x="36" y="69" style="font-size:12.5px">tea.Stock = -1;</text>
<rect x="24" y="96" width="330" height="40" rx="6" class="b" data-hl="2"/><text class="t-c" x="36" y="121" style="font-size:12.5px">var n = tea.Stock;</text>
<g data-s="1"><path d="M354,64 L384,64" class="ln-acc" marker-end="url(#op-a)"/><rect x="390" y="44" width="306" height="40" rx="6" class="b-acc"/><text class="t-c" x="402" y="69" style="font-size:12.5px">tea.set_Stock(-1);   ← a method call</text></g>
<g data-s="2"><path d="M354,116 L384,116" class="ln-acc" marker-end="url(#op-a)"/><rect x="390" y="96" width="306" height="40" rx="6" class="b-acc"/><text class="t-c" x="402" y="121" style="font-size:12.5px">var n = tea.get_Stock();</text></g>
<g data-s="3"><rect x="390" y="150" width="306" height="70" rx="8" class="b-bad"/><text class="t-c" x="402" y="172" style="font-size:12px">set_Stock(int value) {</text><text class="t-c" x="402" y="190" style="font-size:12px">  if (value &lt; 0) throw …;</text><text class="t-c" x="402" y="208" style="font-size:12px">  _stock = value; }</text>
<text class="t-s t-bad" x="24" y="186">Because it's really a method, the setter can</text><text class="t-s t-bad" x="24" y="206">refuse -1 before it ever reaches the field.</text></g>
<g data-s="4"><rect x="24" y="230" width="672" height="40" rx="8" class="b-good"/><text class="t-s" x="36" y="255">A field can't do this: it's just a slot of memory. Callers can't tell the difference, so you can add rules later.</text></g>
<text class="t-s" x="24" y="186" data-s="1-1">Looks like writing a field. It isn't.</text>
<text class="t-s" x="24" y="186" data-s="2-2">Reading it is a call too, to get_Stock().</text>
</svg>
