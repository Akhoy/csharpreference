<g data-s="2-2">
<text class="t-s t-bad" x="24" y="108">line.Split(',') makes a string[] plus 4 NEW strings: every character copied</text>
<rect x="24" y="124" width="160" height="34" rx="6" class="b-bad"/><text class="t-c" x="34" y="146" style="font-size:12px">"2026-11-27"</text>
<rect x="196" y="124" width="104" height="34" rx="6" class="b-bad"/><text class="t-c" x="206" y="146" style="font-size:12px">"TEA-01"</text>
<rect x="312" y="124" width="76" height="34" rx="6" class="b-bad"/><text class="t-c" x="322" y="146" style="font-size:12px">"6.50"</text>
<rect x="400" y="124" width="62" height="34" rx="6" class="b-bad"/><text class="t-c" x="410" y="146" style="font-size:12px">"GBP"</text>
<rect x="474" y="124" width="96" height="34" rx="6" class="b-bad"/><text class="t-c" x="484" y="146" style="font-size:12px">string[4]</text>
<text class="t-h t-bad" x="24" y="200">5 objects per line × 2,000,000 lines = 10 million objects</text><text class="t-s" x="24" y="222">…all garbage a moment later. The GC spends more time cleaning than the import spends working.</text>
</g>
<g data-s="3-3"><rect x="21" y="36" width="244" height="42" rx="6" fill="none" class="ln-acc" style="stroke-width:3"/></g><g data-s="4-4" data-mv="4:432,0"><rect x="21" y="36" width="100" height="42" rx="6" fill="none" class="ln-acc" style="stroke-width:3"/></g>
<g data-s="3-3"><text class="t-s t-acc" x="24" y="108">ReadOnlySpan&lt;char&gt; field = line.AsSpan(0, 10);</text><text class="t-s" x="24" y="130">A span is just (where it starts, how long it is) over the SAME characters.</text><text class="t-s t-good" x="24" y="152">Nothing copied. Nothing allocated.</text></g>
<g data-s="4-4"><text class="t-s t-acc" x="24" y="108">decimal.Parse(line.AsSpan(18, 4))</text><text class="t-s" x="24" y="130">Move the window to the price field and parse straight from the original text.</text><text class="t-h t-good" x="24" y="170">0 allocations per line</text><text class="t-s" x="24" y="192">The import that took 40 minutes finishes in a few.</text></g>
<g data-s="5"><rect x="24" y="96" width="672" height="140" rx="10" class="b-deep"/>
<text class="t-h" x="40" y="122">Why Span has strict rules (it's a "ref struct")</text>
<text class="t-s" x="40" y="146">A span can point at stack memory, which vanishes when the method returns.</text>
<text class="t-s" x="40" y="168">So the compiler never lets a span reach the heap: no class fields, no lambdas,</text>
<text class="t-s" x="40" y="190">no await, no boxing. Need one of those? Use Memory&lt;T&gt;, the heap-safe cousin.</text>
<text class="t-s t-good" x="40" y="218">The rules are what make "zero-copy" safe.</text></g>
<text class="t-s" x="24" y="108" data-s="1-1">One string, 26 characters. You need four fields out of it, two million times a night.</text>
</svg>
