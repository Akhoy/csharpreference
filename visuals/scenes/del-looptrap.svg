<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="In a for loop every lambda captures the same single variable i, so all see its final value; copying into a fresh local gives each lambda its own">
<defs><marker id="dl-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-ink"/></marker></defs>
<text class="t-cap" x="24" y="28">for (int i = 0; i &lt; 3; i++) actions.Add(() =&gt; Console.Write(i));</text>
<g data-s="1-3"><rect x="24" y="44" width="120" height="40" rx="6" class="b"/><text class="t-c" x="36" y="69" style="font-size:12px">lambda #0</text>
<rect x="24" y="94" width="120" height="40" rx="6" class="b" data-s="2"/><text class="t-c" x="36" y="119" style="font-size:12px" data-s="2">lambda #1</text>
<rect x="24" y="144" width="120" height="40" rx="6" class="b" data-s="2"/><text class="t-c" x="36" y="169" style="font-size:12px" data-s="2">lambda #2</text>
<rect x="320" y="84" width="180" height="60" rx="10" class="b-warn"/><text class="t-cap" x="332" y="104">ONE BACKPACK</text>
<text class="t-c" x="332" y="128" data-s="1-1">i = 0</text><text class="t-c" x="332" y="128" data-s="2-2">i = 2</text><text class="t-c t-bad" x="332" y="128" data-s="3-3">i = 3 (loop ended)</text>
<path d="M144,64 C220,64 250,100 314,104" class="ln" marker-end="url(#dl-a)"/>
<g data-s="2"><path d="M144,114 L314,114" class="ln" marker-end="url(#dl-a)"/><path d="M144,164 C220,164 250,130 314,124" class="ln" marker-end="url(#dl-a)"/></g></g>
<text class="t-s" x="24" y="220" data-s="1-1">The loop has ONE variable i. The first lambda captures it, meaning the variable itself, not its value.</text>
<text class="t-s" x="24" y="220" data-s="2-2">Lambdas #1 and #2 capture the very same variable. Three arrows, one backpack.</text>
<text class="t-s t-bad" x="24" y="220" data-s="3-3">By the time they run, the loop has finished and i is 3. All three print 3: "333".</text>
<g data-s="4"><rect x="24" y="44" width="120" height="40" rx="6" class="b"/><text class="t-c" x="36" y="69" style="font-size:12px">lambda #0</text><rect x="24" y="94" width="120" height="40" rx="6" class="b"/><text class="t-c" x="36" y="119" style="font-size:12px">lambda #1</text><rect x="24" y="144" width="120" height="40" rx="6" class="b"/><text class="t-c" x="36" y="169" style="font-size:12px">lambda #2</text>
<rect x="320" y="44" width="150" height="40" rx="6" class="b-good"/><text class="t-c" x="332" y="69" style="font-size:12px">copy = 0</text><rect x="320" y="94" width="150" height="40" rx="6" class="b-good"/><text class="t-c" x="332" y="119" style="font-size:12px">copy = 1</text><rect x="320" y="144" width="150" height="40" rx="6" class="b-good"/><text class="t-c" x="332" y="169" style="font-size:12px">copy = 2</text>
<path d="M144,64 L314,64" class="ln" marker-end="url(#dl-a)"/><path d="M144,114 L314,114" class="ln" marker-end="url(#dl-a)"/><path d="M144,164 L314,164" class="ln" marker-end="url(#dl-a)"/>
<text class="t-s t-good" x="24" y="220">var copy = i; inside the loop body: a NEW variable each time round, so three backpacks.</text><text class="t-s t-good" x="24" y="240">Prints "012". foreach does this for you automatically.</text></g>
</svg>
