<text class="t-s t-bad" x="390" y="252">A bad GetHashCode (say, always 0)</text><text class="t-s t-bad" x="390" y="272">piles every key into ONE bucket.</text><text class="t-s t-bad" x="390" y="292">Back to checking one by one: O(n).</text></g>
