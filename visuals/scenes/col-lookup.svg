<g data-s="1-2" data-mv="2:603,0"><rect x="21" y="41" width="66" height="46" rx="8" fill="none" class="ln-acc" style="stroke-width:3"/></g>
<text class="t-s" x="24" y="110" data-s="1-1">Is it #0? No. Move to the next one…</text>
<text class="t-s t-bad" x="24" y="110" data-s="2">…and the next, and the next. Up to 200,000 checks for one order. O(n)</text>
<line x1="24" y1="128" x2="696" y2="128" class="ln-m"/>
<text class="t-cap" x="24" y="152" data-s="3">Dictionary&lt;int, Order&gt; · FIND ORDER #7319</text>
