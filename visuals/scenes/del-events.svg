<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="An event: subscribers add themselves; only the publisher can raise it, and every subscriber is called in order">
<defs><marker id="de-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-acc"/></marker>
<marker id="de-arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-m"/></marker></defs>
<text class="t-cap" x="24" y="28">PUBLISHER</text><text class="t-cap" x="450" y="28">SUBSCRIBERS (don't know each other)</text>
<rect x="24" y="80" width="230" height="120" rx="12" class="b-acc" data-hl="4"/>
<text class="t-h" x="40" y="108">Checkout</text><text class="t-c" x="40" y="134" style="font-size:12px">event OrderPlaced</text>
<text class="t-m" x="40" y="160">subscriber list:</text>
<text class="t-c" x="40" y="182" style="font-size:12px" data-s="1-1">[ ]</text>
<text class="t-c" x="40" y="182" style="font-size:12px" data-s="2-2">[Email]</text>
<text class="t-c" x="40" y="182" style="font-size:12px" data-s="3">[Email, Stock, Stats]</text>
<g data-s="2" class="fly-r"><rect x="450" y="50" width="200" height="50" rx="10" class="b-good" data-hl="4"/><text class="t-c" x="466" y="80">EmailSender</text>
<path d="M444,75 L262,110" class="ln-m" marker-end="url(#de-arm)" data-s="2-3"/><text class="t-c t-m" x="330" y="82" data-s="2-3">+=</text></g>
<g data-s="3" class="fly-r"><rect x="450" y="118" width="200" height="50" rx="10" class="b-info" data-hl="4"/><text class="t-c" x="466" y="148">StockKeeper</text>
<rect x="450" y="186" width="200" height="50" rx="10" class="b-warn" data-hl="4"/><text class="t-c" x="466" y="216">Analytics</text>
<path d="M444,143 L262,140" class="ln-m" marker-end="url(#de-arm)" data-s="3-3"/><path d="M444,211 L262,170" class="ln-m" marker-end="url(#de-arm)" data-s="3-3"/></g>
<g data-s="4-4"><path d="M254,110 L444,75" class="ln-acc" marker-end="url(#de-ar)"/><path d="M254,140 L444,143" class="ln-acc" marker-end="url(#de-ar)"/><path d="M254,170 L444,211" class="ln-acc" marker-end="url(#de-ar)"/>
<text class="t-c t-acc" x="660" y="80">1</text><text class="t-c t-acc" x="660" y="148">2</text><text class="t-c t-acc" x="660" y="216">3</text>
<text class="t-s t-acc" x="24" y="270">An order is placed: Checkout raises the event, and each subscriber is called in order.</text></g>
<g data-s="5"><text class="t-s t-bad" x="24" y="256">✗ outsiders can't raise it:  checkout.OrderPlaced(…)</text><text class="t-s t-bad" x="24" y="278">✗ outsiders can't wipe the list:  checkout.OrderPlaced = null</text></g>
<text class="t-s" x="24" y="270" data-s="1-1">Checkout announces "an order was placed". It doesn't know who's listening.</text>
<text class="t-s" x="24" y="270" data-s="2-3">Each subscriber adds itself with +=.</text>
</svg>
