<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="List grows by allocating an array twice the size and copying everything across; this is rare enough that Add is constant time on average">
<defs><marker id="cz-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-acc"/></marker></defs>
<text class="t-cap" x="24" y="28">List&lt;int&gt; INSIDE: AN ARRAY WITH SPARE ROOM</text>
<g data-s="1-2"><rect x="24" y="44" width="40" height="36" rx="4" class="b"/><text class="t-c" x="44" y="67" text-anchor="middle" style="font-size:12px">1</text><rect x="68" y="44" width="40" height="36" rx="4" class="b"/><text class="t-c" x="88" y="67" text-anchor="middle" style="font-size:12px">2</text><rect x="112" y="44" width="40" height="36" rx="4" class="b"/><text class="t-c" x="132" y="67" text-anchor="middle" style="font-size:12px">3</text><rect x="156" y="44" width="40" height="36" rx="4" class="b"/><text class="t-c" x="176" y="67" text-anchor="middle" style="font-size:12px">4</text></g>
<g data-s="3"><rect x="24" y="44" width="40" height="36" rx="4" class="b-dash"/><text class="t-c" x="44" y="67" text-anchor="middle" style="font-size:12px">1</text><rect x="68" y="44" width="40" height="36" rx="4" class="b-dash"/><text class="t-c" x="88" y="67" text-anchor="middle" style="font-size:12px">2</text><rect x="112" y="44" width="40" height="36" rx="4" class="b-dash"/><text class="t-c" x="132" y="67" text-anchor="middle" style="font-size:12px">3</text><rect x="156" y="44" width="40" height="36" rx="4" class="b-dash"/><text class="t-c" x="176" y="67" text-anchor="middle" style="font-size:12px">4</text></g>
<text class="t-s" x="210" y="67" data-s="1-1">Count 4, Capacity 4: full. Add(5) has nowhere to go.</text>
<text class="t-m" x="210" y="67" data-s="3">old array: garbage now</text>
<g data-s="2-2"><rect x="24" y="100" width="40" height="36" rx="4" class="b-dash"/><rect x="68" y="100" width="40" height="36" rx="4" class="b-dash"/><rect x="112" y="100" width="40" height="36" rx="4" class="b-dash"/><rect x="156" y="100" width="40" height="36" rx="4" class="b-dash"/><rect x="200" y="100" width="40" height="36" rx="4" class="b-dash"/><rect x="244" y="100" width="40" height="36" rx="4" class="b-dash"/><rect x="288" y="100" width="40" height="36" rx="4" class="b-dash"/><rect x="332" y="100" width="40" height="36" rx="4" class="b-dash"/></g>
<text class="t-s t-acc" x="24" y="160" data-s="2-2">Step 1: allocate a NEW array, twice as big (8 slots)…</text>
<g data-s="3-3"><rect x="24" y="100" width="40" height="36" rx="4" class="b-good"/><text class="t-c" x="44" y="123" text-anchor="middle" style="font-size:12px">1</text><rect x="68" y="100" width="40" height="36" rx="4" class="b-good"/><text class="t-c" x="88" y="123" text-anchor="middle" style="font-size:12px">2</text><rect x="112" y="100" width="40" height="36" rx="4" class="b-good"/><text class="t-c" x="132" y="123" text-anchor="middle" style="font-size:12px">3</text><rect x="156" y="100" width="40" height="36" rx="4" class="b-good"/><text class="t-c" x="176" y="123" text-anchor="middle" style="font-size:12px">4</text><rect x="200" y="100" width="40" height="36" rx="4" class="b-dash"/><rect x="244" y="100" width="40" height="36" rx="4" class="b-dash"/><rect x="288" y="100" width="40" height="36" rx="4" class="b-dash"/><rect x="332" y="100" width="40" height="36" rx="4" class="b-dash"/></g>
<g data-s="3-3"><path d="M110,82 L110,98" class="ln-acc" marker-end="url(#cz-a)"/><text class="t-s t-acc" x="24" y="160">Step 2: copy all 4 items across (that one Add costs O(n)), then put 5 in.</text><rect x="200" y="100" width="40" height="36" rx="4" class="b-acc"/><text class="t-c" x="220" y="123" text-anchor="middle" style="font-size:12px">5</text></g>
<g data-s="4-5"><rect x="24" y="100" width="40" height="36" rx="4" class="b-good"/><text class="t-c" x="44" y="123" text-anchor="middle" style="font-size:12px">1</text><rect x="68" y="100" width="40" height="36" rx="4" class="b-good"/><text class="t-c" x="88" y="123" text-anchor="middle" style="font-size:12px">2</text><rect x="112" y="100" width="40" height="36" rx="4" class="b-good"/><text class="t-c" x="132" y="123" text-anchor="middle" style="font-size:12px">3</text><rect x="156" y="100" width="40" height="36" rx="4" class="b-good"/><text class="t-c" x="176" y="123" text-anchor="middle" style="font-size:12px">4</text><rect x="200" y="100" width="40" height="36" rx="4" class="b-good"/><text class="t-c" x="220" y="123" text-anchor="middle" style="font-size:12px">5</text><rect x="244" y="100" width="40" height="36" rx="4" class="b-good"/><text class="t-c" x="264" y="123" text-anchor="middle" style="font-size:12px">6</text><rect x="288" y="100" width="40" height="36" rx="4" class="b-good"/><text class="t-c" x="308" y="123" text-anchor="middle" style="font-size:12px">7</text><rect x="332" y="100" width="40" height="36" rx="4" class="b-good"/><text class="t-c" x="352" y="123" text-anchor="middle" style="font-size:12px">8</text></g>
<text class="t-s t-good" x="24" y="160" data-s="4-4">Adds 6, 7 and 8 just drop into free slots: no copying at all.</text>
<g data-s="5"><text class="t-s" x="24" y="160">The 9th Add doubles again, to 16. Then 32, 64… Copies get rarer as the list grows.</text>
<rect x="24" y="180" width="672" height="100" rx="10" class="b-deep"/><text class="t-h" x="40" y="206">"Amortised O(1)"</text><text class="t-s" x="40" y="230">A few Adds are expensive, but because the size doubles, they're rare. Spread over every</text><text class="t-s" x="40" y="250">Add, the average cost stays constant. Know the size in advance? new List&lt;T&gt;(capacity)</text><text class="t-s" x="40" y="270">skips the copies entirely.</text></g>
</svg>
