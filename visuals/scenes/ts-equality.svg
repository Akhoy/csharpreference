<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-label="How a HashSet finds an item: GetHashCode picks a bucket, Equals confirms the match; a missing GetHashCode or a changed key sends the lookup to the wrong bucket">
<defs><marker id="te-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-acc"/></marker>
<marker id="te-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-bad"/></marker></defs>
<text class="t-cap" x="24" y="28">HashSet&lt;Sku&gt; · 8 BUCKETS</text>
<g><rect x="300" y="44" width="46" height="46" rx="6" class="b-sunk"/><rect x="350" y="44" width="46" height="46" rx="6" class="b-sunk"/><rect x="400" y="44" width="46" height="46" rx="6" class="b-sunk"/><rect x="450" y="44" width="46" height="46" rx="6" class="b-sunk"/><rect x="500" y="44" width="46" height="46" rx="6" class="b-sunk"/><rect x="550" y="44" width="46" height="46" rx="6" class="b-sunk"/><rect x="600" y="44" width="46" height="46" rx="6" class="b-sunk"/><rect x="650" y="44" width="46" height="46" rx="6" class="b-sunk"/>
<text class="t-m" x="323" y="38" text-anchor="middle">0</text><text class="t-m" x="373" y="38" text-anchor="middle">1</text><text class="t-m" x="423" y="38" text-anchor="middle">2</text><text class="t-m" x="473" y="38" text-anchor="middle">3</text><text class="t-m" x="523" y="38" text-anchor="middle">4</text><text class="t-m" x="573" y="38" text-anchor="middle">5</text><text class="t-m" x="623" y="38" text-anchor="middle">6</text><text class="t-m" x="673" y="38" text-anchor="middle">7</text></g>
<g data-s="1-2,4-4"><rect x="654" y="52" width="38" height="30" rx="4" class="b-good"/><text class="t-c" x="673" y="72" text-anchor="middle" style="font-size:11px">a</text></g>
<g data-s="3-3"><rect x="404" y="52" width="38" height="30" rx="4" class="b-good"/><text class="t-c" x="423" y="72" text-anchor="middle" style="font-size:11px">a</text></g>
<g data-s="1-1"><rect x="24" y="44" width="230" height="56" rx="8" class="b"/><text class="t-c" x="36" y="66" style="font-size:12px">set.Add(a)</text><text class="t-m" x="36" y="88">a = Sku("TEA-01")</text>
<path d="M254,72 C400,130 640,130 672,92" class="ln-acc" marker-end="url(#te-a)"/><text class="t-s t-acc" x="380" y="146">GetHashCode() → 7, so a goes in bucket 7</text></g>
<g data-s="2-2"><rect x="24" y="44" width="230" height="56" rx="8" class="b"/><text class="t-c" x="36" y="66" style="font-size:12px">set.Contains(b)</text><text class="t-m" x="36" y="88">b = a NEW Sku("TEA-01")</text>
<path d="M254,72 C400,130 640,130 672,92" class="ln-acc" marker-end="url(#te-a)"/><text class="t-s t-acc" x="300" y="146">same value, so same hash: 7. Look ONLY in bucket 7,</text><text class="t-s t-good" x="300" y="166">then Equals(a, b) confirms: found ✓</text></g>
<g data-s="3-3"><rect x="24" y="44" width="230" height="56" rx="8" class="b-bad"/><text class="t-c" x="36" y="66" style="font-size:12px">Equals overridden,</text><text class="t-c" x="36" y="86" style="font-size:12px">GetHashCode NOT</text>
<path d="M254,72 C380,140 560,140 573,92" class="ln-bad" marker-end="url(#te-b)"/><text class="t-s t-bad" x="300" y="146">a went to bucket 2, b's hash says bucket 5.</text><text class="t-s t-bad" x="300" y="166">Bucket 5 is empty: "not found", though Equals would say yes ✗</text></g>
<g data-s="4-4"><rect x="24" y="44" width="230" height="56" rx="8" class="b-bad"/><text class="t-c" x="36" y="66" style="font-size:12px">a.Code = "TEA-99"</text><text class="t-m" x="36" y="88">(after adding a)</text>
<path d="M254,72 C380,140 460,140 473,92" class="ln-bad" marker-end="url(#te-b)"/><text class="t-s t-bad" x="300" y="146">a still sits in bucket 7, but its hash is now 3.</text><text class="t-s t-bad" x="300" y="166">Every lookup checks bucket 3. a is lost forever ✗</text></g>
<g data-s="5"><rect x="24" y="190" width="672" height="100" rx="10" class="b-good"/><text class="t-h" x="40" y="216">The two rules</text>
<text class="t-s" x="40" y="242">1. Equal objects must give equal hash codes (override Equals AND GetHashCode together).</text>
<text class="t-s" x="40" y="264">2. Never change a key while it's inside a HashSet or Dictionary.</text><text class="t-s t-good" x="40" y="284">A record follows rule 1 for you.</text></g>
<text class="t-s" x="24" y="220" data-s="1-4">The hash code is the shortcut: it says which ONE bucket to search.</text>
</svg>
