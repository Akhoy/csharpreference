<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="IQueryable sends a filtered SQL query to the database and gets 20 rows back; IEnumerable pulls the whole table and filters in memory">
<defs><marker id="lw-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-acc"/></marker>
<marker id="lw-arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-bad"/></marker></defs>
<text class="t-cap" x="24" y="28">YOUR APP</text><text class="t-cap" x="540" y="28">DATABASE · 1M rows</text>
<rect x="24" y="40" width="230" height="250" rx="12" class="b-sunk"/><rect x="540" y="40" width="156" height="250" rx="12" class="b-sunk"/>
<g><rect x="560" y="60" width="116" height="16" rx="3" class="b"/><rect x="560" y="80" width="116" height="16" rx="3" class="b"/><rect x="560" y="100" width="116" height="16" rx="3" class="b"/><rect x="560" y="120" width="116" height="16" rx="3" class="b"/><rect x="560" y="140" width="116" height="16" rx="3" class="b"/><text class="t-m" x="618" y="176" text-anchor="middle">⋮</text></g>
<g data-s="1-3"><text class="t-cap" x="36" y="60">IQueryable&lt;Order&gt;</text>
<text class="t-c" x="36" y="84" style="font-size:12px">db.Orders</text><text class="t-c" x="36" y="102" style="font-size:12px">  .Where(o =&gt; o.Paid)</text><text class="t-c" x="36" y="120" style="font-size:12px">  .Take(20)</text>
<text class="t-m" x="36" y="146">a description of the query</text><text class="t-m" x="36" y="162">(an expression tree)</text></g>
<g data-s="2-3"><path d="M254,100 L534,100" class="ln-acc" marker-end="url(#lw-ar)"/>
<rect x="276" y="70" width="240" height="22" rx="4" class="b-acc"/><text class="t-c" x="286" y="86" style="font-size:11px">SELECT TOP 20 … WHERE Paid = 1</text>
<text class="t-m" x="276" y="118">EF Core translated your C# into SQL</text></g>
<g data-s="3-3"><path d="M534,200 L260,200" class="ln-acc" marker-end="url(#lw-ar)"/>
<rect x="360" y="182" width="60" height="16" rx="3" class="b-good"/><text class="t-m" x="300" y="226">20 rows come back. Small, fast.</text>
<text class="t-s t-good" x="36" y="250">✓ The database did the filtering.</text></g>
<g data-s="4"><text class="t-cap" x="36" y="60">IEnumerable&lt;Order&gt;</text>
<text class="t-c" x="36" y="84" style="font-size:12px">IEnumerable&lt;Order&gt; all</text><text class="t-c" x="36" y="102" style="font-size:12px">  = db.Orders;</text><text class="t-c" x="36" y="120" style="font-size:12px">all.Where(…).Take(20)</text>
<path d="M254,100 L534,100" class="ln-bad" marker-end="url(#lw-arb)"/><rect x="276" y="70" width="240" height="22" rx="4" class="b-bad"/><text class="t-c" x="286" y="86" style="font-size:11px">SELECT * FROM Orders</text>
<path d="M534,200 L260,200" class="ln-bad" marker-end="url(#lw-arb)" style="stroke-width:7"/>
<rect x="290" y="150" width="200" height="40" rx="4" class="b-bad"/><text class="t-c" x="300" y="175" style="font-size:12px">1,000,000 rows…</text>
<text class="t-s t-bad" x="36" y="230">✗ The whole table crossed</text><text class="t-s t-bad" x="36" y="250">the network, then 999,980</text><text class="t-s t-bad" x="36" y="270">rows were thrown away here.</text></g>
</svg>
