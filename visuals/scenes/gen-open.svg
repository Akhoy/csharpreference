<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="An open generic registration lets the DI container fill in the type for any request">
<defs><marker id="go-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-acc"/></marker></defs>
<text class="t-cap" x="24" y="28">ONE REGISTRATION, AT STARTUP</text>
<rect x="24" y="40" width="672" height="40" rx="8" class="b-acc"/><text class="t-c" x="36" y="65" style="font-size:12px">AddScoped(typeof(IRepository&lt;&gt;), typeof(EfRepository&lt;&gt;));   // the blank is left open</text>
<text class="t-cap" x="24" y="110">LATER, CODE ASKS FOR…</text><text class="t-cap" x="420" y="110">THE CONTAINER BUILDS</text>
<g data-s="2" class="fly"><rect x="24" y="122" width="320" height="36" rx="6" class="b"/><text class="t-c" x="36" y="145" style="font-size:12px">IRepository&lt;Order&gt;</text>
<path d="M344,140 L414,140" class="ln-acc" marker-end="url(#go-a)"/><rect x="420" y="122" width="276" height="36" rx="6" class="b-good"/><text class="t-c" x="432" y="145" style="font-size:12px">EfRepository&lt;Order&gt;</text></g>
<g data-s="3" class="fly"><rect x="24" y="168" width="320" height="36" rx="6" class="b"/><text class="t-c" x="36" y="191" style="font-size:12px">IRepository&lt;Customer&gt;</text>
<path d="M344,186 L414,186" class="ln-acc" marker-end="url(#go-a)"/><rect x="420" y="168" width="276" height="36" rx="6" class="b-good"/><text class="t-c" x="432" y="191" style="font-size:12px">EfRepository&lt;Customer&gt;</text></g>
<text class="t-s" x="24" y="240" data-s="1-1">IRepository&lt;&gt; with nothing in the brackets is an OPEN generic: the template, blank still empty.</text>
<text class="t-s" x="24" y="240" data-s="2-2">When something needs IRepository&lt;Order&gt;, the container fills the same blank with Order.</text>
<text class="t-s t-good" x="24" y="240" data-s="3">Any entity, today's or next year's, works without another registration line.</text>
</svg>
