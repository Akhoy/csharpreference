<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-label="Where is an ordinary method containing a foreach and an if; your lambda is plugged into the if">
<defs><marker id="lw2-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-acc"/></marker></defs>
<text class="t-cap" x="24" y="28">YOU WRITE</text><text class="t-cap" x="360" y="28">INSIDE System.Linq (simplified)</text>
<rect x="24" y="44" width="300" height="40" rx="6" class="b" data-hl="1"/><text class="t-c" x="36" y="69" style="font-size:12.5px">orders.Where(<tspan class="t-acc" font-weight="700">o =&gt; o.Paid</tspan>)</text>
<g data-s="2"><rect x="360" y="44" width="336" height="150" rx="8" class="b-sunk"/>
<text class="t-c" x="372" y="66" style="font-size:11.5px">static IEnumerable&lt;T&gt; Where&lt;T&gt;(</text><text class="t-c" x="372" y="84" style="font-size:11.5px">  this IEnumerable&lt;T&gt; source,</text><text class="t-c" x="372" y="102" style="font-size:11.5px">  Func&lt;T, bool&gt; <tspan class="t-acc">predicate</tspan>)</text>
<text class="t-c" x="372" y="124" style="font-size:11.5px">{ foreach (var item in source)</text><text class="t-c" x="372" y="142" style="font-size:11.5px">    if (<tspan class="t-acc">predicate(item)</tspan>)</text><text class="t-c" x="372" y="160" style="font-size:11.5px">      yield return item; }</text></g>
<g data-s="3"><path d="M250,84 C300,140 320,140 380,140" class="ln-acc" marker-end="url(#lw2-a)"/><text class="t-s t-acc" x="24" y="120">your lambda is plugged in</text><text class="t-s t-acc" x="24" y="138">as the predicate: the "if"</text></g>
<g data-s="4"><rect x="24" y="214" width="672" height="60" rx="8" class="b-good"/><text class="t-s" x="36" y="238">That's all LINQ is: ordinary methods with the loop already written. You only supply the part</text><text class="t-s" x="36" y="258">that changes (the test, the transform), as a delegate. The same idea as Episode 4's discount slot.</text></g>
<text class="t-s" x="24" y="120" data-s="1-1">It looks like special syntax.</text><text class="t-s" x="24" y="138" data-s="1-1">It's just a method call.</text>
<text class="t-s" x="24" y="120" data-s="2-2">Where is a normal method. Its "this" first</text><text class="t-s" x="24" y="138" data-s="2-2">parameter makes it an extension method.</text>
</svg>
