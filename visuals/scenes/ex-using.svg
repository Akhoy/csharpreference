<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Without using, a connection taken from the pool is never returned when code throws; with using, Dispose returns it even on failure">
<text class="t-cap" x="24" y="28">CHECKOUT REQUESTS</text><text class="t-cap" x="460" y="28">CONNECTION POOL (4 connections)</text>
<rect x="460" y="44" width="236" height="120" rx="12" class="b-sunk"/>
<g><rect x="478" y="64" width="44" height="80" rx="6" class="b-good" data-s="1-1"/><rect x="478" y="64" width="44" height="80" rx="6" class="b-dash" data-s="2-4"/><rect x="478" y="64" width="44" height="80" rx="6" class="b-good" data-s="5"/></g>
<g><rect x="532" y="64" width="44" height="80" rx="6" class="b-good" data-s="1-2"/><rect x="532" y="64" width="44" height="80" rx="6" class="b-dash" data-s="3-4"/><rect x="532" y="64" width="44" height="80" rx="6" class="b-good" data-s="5"/></g>
<g><rect x="586" y="64" width="44" height="80" rx="6" class="b-good" data-s="1-3"/><rect x="586" y="64" width="44" height="80" rx="6" class="b-dash" data-s="4-4"/><rect x="586" y="64" width="44" height="80" rx="6" class="b-good" data-s="5"/></g>
<g><rect x="640" y="64" width="44" height="80" rx="6" class="b-good" data-s="1-3"/><rect x="640" y="64" width="44" height="80" rx="6" class="b-dash" data-s="4-4"/><rect x="640" y="64" width="44" height="80" rx="6" class="b-good" data-s="5"/></g>
<g data-s="1-4"><rect x="24" y="44" width="400" height="120" rx="10" class="b"/>
<text class="t-c" x="40" y="70" style="font-size:12.5px">var conn = pool.Open();</text>
<text class="t-c" x="40" y="94" style="font-size:12.5px">Charge(order);    <tspan class="t-bad">// throws!</tspan></text>
<text class="t-c" x="40" y="118" style="font-size:12.5px">conn.Close();     <tspan class="t-m">// never reached</tspan></text>
<text class="t-cap" x="40" y="148">WITHOUT using</text></g>
<g data-s="5"><rect x="24" y="44" width="400" height="120" rx="10" class="b-good"/>
<text class="t-c" x="40" y="70" style="font-size:12.5px">using var conn = pool.Open();</text>
<text class="t-c" x="40" y="94" style="font-size:12.5px">Charge(order);    <tspan class="t-bad">// throws!</tspan></text>
<text class="t-c" x="40" y="118" style="font-size:12.5px"><tspan class="t-good">// Dispose() runs anyway: hidden finally</tspan></text>
<text class="t-cap" x="40" y="148">WITH using</text></g>
<text class="t-s" x="24" y="200" data-s="1-1">The pool has 4 open connections, ready to lend out.</text>
<text class="t-s t-bad" x="24" y="200" data-s="2-2">Request 1 borrows one, then Charge throws. Close() is skipped: that connection is lost.</text>
<text class="t-s t-bad" x="24" y="200" data-s="3-3">Request 2 fails the same way. Two leaked.</text>
<g data-s="4-4"><text class="t-s t-bad" x="24" y="200">A few more failures and the pool is empty. Every request now waits,</text><text class="t-s t-bad" x="24" y="220">then fails: "Timeout expired obtaining a connection". The site is down.</text></g>
<g data-s="5"><text class="t-s t-good" x="24" y="200">using turns into try { … } finally { conn.Dispose(); }. The connection goes back</text><text class="t-s t-good" x="24" y="220">to the pool on every path out: success, return or exception.</text></g>
</svg>
