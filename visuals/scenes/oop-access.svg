<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="Access modifiers as nested rings: private inside the class, protected adds subclasses, internal is the whole assembly, public is everyone">
<text class="t-cap" x="24" y="28">WHO CAN SEE A MEMBER?</text>
<g data-s="4" class="fly"><rect x="24" y="40" width="672" height="270" rx="16" class="b-good" style="fill-opacity:.35"/><text class="t-h t-good" x="40" y="66">public</text><text class="t-s" x="110" y="66">everyone, including other teams' code and other apps using your library</text></g>
<g data-s="3" class="fly"><rect x="52" y="80" width="616" height="210" rx="14" class="b-info" style="fill-opacity:.4"/><text class="t-h t-info" x="68" y="104">internal</text><text class="t-s" x="146" y="104">any code in the same assembly (project), e.g. Kettle.Core.dll</text></g>
<g data-s="2" class="fly"><rect x="80" y="118" width="400" height="152" rx="12" class="b-warn" style="fill-opacity:.45"/><text class="t-h t-warn" x="96" y="142">protected</text><text class="t-s" x="186" y="142">the class + its subclasses (even in other projects)</text>
<rect x="320" y="160" width="146" height="96" rx="10" class="b"/><text class="t-c" x="332" y="186" style="font-size:11.5px">class</text><text class="t-c" x="332" y="204" style="font-size:11.5px">GiftCard</text><text class="t-c" x="332" y="222" style="font-size:11.5px">: PaymentMethod</text></g>
<g data-s="1"><rect x="108" y="160" width="196" height="96" rx="10" class="b-acc"/><text class="t-h t-acc" x="124" y="186">private</text><text class="t-s" x="124" y="208">only code inside this</text><text class="t-s" x="124" y="226">one class</text><text class="t-c t-m" x="124" y="246" style="font-size:11px">class PaymentMethod</text></g>
<g data-s="5"><rect x="500" y="160" width="152" height="96" rx="10" class="b-deep"/><text class="t-s" x="512" y="184">Defaults:</text><text class="t-s" x="512" y="204">members → private</text><text class="t-s" x="512" y="224">types → internal</text><text class="t-m" x="512" y="244">start small, widen later</text></g>
</svg>
