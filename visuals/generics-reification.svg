<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="t d">
<title id="t">Reification: List&lt;int&gt; and List&lt;string&gt; are compiled differently</title>
<desc id="d">One source, List of T. When T is a value type like int, the JIT compiles a separate specialised copy of the code that stores ints directly, inline, with no boxing. When T is a reference type like string, every reference is the same size, so the JIT shares one compiled implementation and looks up the real type only when needed. typeof(T) still returns the real closed type at runtime either way.</desc>
<style>
  <![CDATA[
  .bg   { fill:#f5f6f9; }
  .cap  { font: 600 13px "IBM Plex Sans","Segoe UI",sans-serif; fill:#171b26; }
  .sub  { font: 400 12.5px "IBM Plex Sans","Segoe UI",sans-serif; fill:#646c7e; }
  .lblw { font: 600 11.5px "JetBrains Mono",monospace; fill:#ffffff; }
  .tag  { font: 700 10.5px "JetBrains Mono",monospace; letter-spacing:.04em; fill:#646c7e; }
  .code { font: 500 13px "JetBrains Mono",monospace; fill:#171b26; }
  .src  { fill:#512bd4; }
  .val  { fill:#22845a; }
  .ref  { fill:#2457c5; }
  .edge { stroke:#dde1ea; stroke-width:1.5; fill:none; }
  @media (prefers-color-scheme: dark) {
    .bg   { fill:#0d0f15; }
    .cap  { fill:#e7e9f0; }
    .sub  { fill:#959db0; }
    .tag  { fill:#959db0; }
    .code { fill:#e7e9f0; }
    .src  { fill:#a993ff; }
    .val  { fill:#4cc58a; }
    .ref  { fill:#7ea6ff; }
    .edge { stroke:#282d3b; }
  }
  .grp { opacity:0; }
  @media (prefers-reduced-motion: reduce) { .grp { opacity:1; animation:none !important; } }

  @keyframes inSrc  { 0%,2%{opacity:0;} 6%,94%{opacity:1;} 98%,100%{opacity:0;} }
  @keyframes inVal  { 0%,22%{opacity:0;} 27%,58%{opacity:1;} 62%,100%{opacity:0;} }
  @keyframes inRef  { 0%,64%{opacity:0;} 69%,94%{opacity:1;} 98%,100%{opacity:0;} }

  .src-g { animation: inSrc 12s ease-in-out infinite; }
  .val-g { animation: inVal 12s ease-in-out infinite; }
  .ref-g { animation: inRef 12s ease-in-out infinite; }
  ]]>
</style>

<rect class="bg" x="0" y="0" width="640" height="380"/>
<text class="cap" x="24" y="28">One generic source, two different compiled outcomes — decided by whether T is a value or reference type</text>
<text class="sub" x="24" y="46">class List&lt;T&gt; { T[] _items; ... }  — the JIT specialises per value-type T, but shares code across reference types</text>

<g class="grp src-g">
  <rect class="src" x="240" y="70" width="160" height="42" rx="8"/>
  <text class="lblw" x="320" y="96" text-anchor="middle">List&lt;T&gt; source (once)</text>
  <path class="edge" d="M280 112 Q 180 150 120 175" marker-end="url(#g1)"/>
  <path class="edge" d="M360 112 Q 460 150 520 175" marker-end="url(#g2)"/>
</g>

<!-- value type path: specialised, inline, no boxing -->
<g class="grp val-g">
  <text class="tag" x="24" y="165">T = int (value type)</text>
  <rect class="val" x="40" y="180" width="200" height="56" rx="8"/>
  <text class="lblw" x="140" y="202" text-anchor="middle">own specialised machine code</text>
  <text class="lblw" x="140" y="220" text-anchor="middle">ints stored inline — no box</text>
  <rect x="56" y="246" width="24" height="24" rx="4" class="val"/>
  <rect x="86" y="246" width="24" height="24" rx="4" class="val"/>
  <rect x="116" y="246" width="24" height="24" rx="4" class="val"/>
  <text class="code" x="150" y="263">1  2  3  — raw bytes, side by side</text>
</g>

<!-- reference type path: shared implementation -->
<g class="grp ref-g">
  <text class="tag" x="420" y="165">T = string (reference type)</text>
  <rect class="ref" x="400" y="180" width="200" height="56" rx="8"/>
  <text class="lblw" x="500" y="202" text-anchor="middle">ONE shared implementation</text>
  <text class="lblw" x="500" y="220" text-anchor="middle">every reference is pointer-sized</text>
  <rect x="416" y="246" width="24" height="24" rx="4" class="ref"/>
  <path class="edge" d="M428 270 L428 300" marker-end="url(#g2)"/>
  <rect x="446" y="246" width="24" height="24" rx="4" class="ref"/>
  <path class="edge" d="M458 270 L478 300" marker-end="url(#g2)"/>
  <text class="code" x="480" y="248">ptr ptr</text>
  <rect x="380" y="300" width="80" height="30" rx="6" class="ref"/>
  <text class="lblw" x="420" y="320" text-anchor="middle" font-size="10">"a"</text>
  <rect x="470" y="300" width="80" height="30" rx="6" class="ref"/>
  <text class="lblw" x="510" y="320" text-anchor="middle" font-size="10">"bb"</text>
</g>

<defs>
  <marker id="g1" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto"><path d="M0,0 L4,6 L8,0 Z" fill="#22845a"/></marker>
  <marker id="g2" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto"><path d="M0,0 L4,6 L8,0 Z" fill="#2457c5"/></marker>
</defs>
</svg>
