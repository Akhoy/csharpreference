<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="t d">
<title id="t">Deferred execution: a LINQ query sits inert until something enumerates it, then runs in full, every time</title>
<desc id="d">Writing numbers.Where(predicate) builds a query object but runs the predicate zero times. Only when a foreach or ToList enumerates the query does the predicate actually run, once per element, seeing the source as it is right now. A second enumeration, such as calling Count, re-runs the entire predicate from scratch rather than reusing the first result.</desc>
<style>
  <![CDATA[
  .bg   { fill:#f5f6f9; }
  .cap  { font: 600 13px "IBM Plex Sans","Segoe UI",sans-serif; fill:#171b26; }
  .sub  { font: 400 12.5px "IBM Plex Sans","Segoe UI",sans-serif; fill:#646c7e; }
  .lblw { font: 600 12px "JetBrains Mono",monospace; fill:#ffffff; }
  .code { font: 500 13px "JetBrains Mono",monospace; fill:#171b26; }
  .tag  { font: 700 10.5px "JetBrains Mono",monospace; letter-spacing:.04em; fill:#646c7e; }
  .query  { fill:#646c7e; }
  .item   { fill:#2457c5; }
  .hit    { fill:#22845a; }
  .trig   { fill:#b06f08; }
  @media (prefers-color-scheme: dark) {
    .bg   { fill:#0d0f15; }
    .cap  { fill:#e7e9f0; }
    .sub  { fill:#959db0; }
    .code { fill:#e7e9f0; }
    .tag  { fill:#959db0; }
    .query  { fill:#959db0; }
    .item   { fill:#7ea6ff; }
    .hit    { fill:#4cc58a; }
    .trig   { fill:#e6a83a; }
  }
  .grp { opacity:0; }
  @media (prefers-reduced-motion: reduce) { .grp { opacity:1; animation:none !important; } }

  @keyframes inBuild { 0%,2%{opacity:0;} 6%,30%{opacity:1;} 34%,100%{opacity:0;} }
  @keyframes inRun1  { 0%,32%{opacity:0;} 36%,62%{opacity:1;} 66%,100%{opacity:0;} }
  @keyframes inRun2  { 0%,64%{opacity:0;} 68%,96%{opacity:1;} 99%,100%{opacity:0;} }

  .stageBuild { animation: inBuild 12s ease-in-out infinite; }
  .stageRun1  { animation: inRun1 12s ease-in-out infinite; }
  .stageRun2  { animation: inRun2 12s ease-in-out infinite; }

  @keyframes pulse { 0%,100% { opacity: 0.25; } 50% { opacity: 1; } }
  .p1 { animation: pulse 1.2s ease-in-out infinite; animation-delay: 0.0s; }
  .p2 { animation: pulse 1.2s ease-in-out infinite; animation-delay: 0.3s; }
  .p3 { animation: pulse 1.2s ease-in-out infinite; animation-delay: 0.6s; }
  .p4 { animation: pulse 1.2s ease-in-out infinite; animation-delay: 0.9s; }
  @media (prefers-reduced-motion: reduce) { .p1,.p2,.p3,.p4 { animation:none !important; opacity:1; } }
  ]]>
</style>

<rect class="bg" x="0" y="0" width="640" height="340"/>
<text class="cap" x="24" y="28">var query = numbers.Where(n => n > 1);</text>
<text class="sub" x="24" y="46">Building the query runs nothing. The predicate only runs when something enumerates query — and it reruns from scratch every time.</text>

<g class="grp stageBuild">
  <rect class="query" x="40" y="90" width="260" height="60" rx="8"/>
  <text class="lblw" x="170" y="115" text-anchor="middle">query: "filter numbers &gt; 1"</text>
  <text class="lblw" x="170" y="135" text-anchor="middle" font-size="10.5">(a description, not a result)</text>
  <text class="tag" x="40" y="180">predicate calls so far: 0</text>
  <text class="sub" x="40" y="200">nothing has run — this line alone changes nothing</text>
</g>

<g class="grp stageRun1">
  <text class="tag" x="24" y="80">foreach (var n in query)  — first enumeration, source is now {1,2,3,4}</text>
  <g class="item p1"><rect x="40" y="100" width="50" height="50"/><text class="lblw" x="65" y="130" text-anchor="middle">1</text></g>
  <g class="item p2"><rect x="100" y="100" width="50" height="50"/><text class="lblw" x="125" y="130" text-anchor="middle">2</text></g>
  <g class="item p3"><rect x="160" y="100" width="50" height="50"/><text class="lblw" x="185" y="130" text-anchor="middle">3</text></g>
  <g class="trig p4"><rect x="220" y="100" width="50" height="50"/><text class="lblw" x="245" y="130" text-anchor="middle">4</text></g>
  <text class="sub" x="40" y="175">4 was added to the list AFTER the query was built — the query still sees it</text>
  <text class="tag" x="40" y="200">predicate runs once per element: 4 calls, result {2,3,4}</text>
</g>

<g class="grp stageRun2">
  <text class="tag" x="24" y="80">query.Count() — a SECOND, independent enumeration</text>
  <g class="hit p1"><rect x="40" y="100" width="50" height="50"/><text class="lblw" x="65" y="130" text-anchor="middle">1</text></g>
  <g class="hit p2"><rect x="100" y="100" width="50" height="50"/><text class="lblw" x="125" y="130" text-anchor="middle">2</text></g>
  <g class="hit p3"><rect x="160" y="100" width="50" height="50"/><text class="lblw" x="185" y="130" text-anchor="middle">3</text></g>
  <g class="hit p4"><rect x="220" y="100" width="50" height="50"/><text class="lblw" x="245" y="130" text-anchor="middle">4</text></g>
  <text class="sub" x="40" y="175">the query has no memory of the first run — it filters all four again, from scratch</text>
  <text class="tag" x="40" y="200">predicate runs again: 4 MORE calls (8 total), not reused from before</text>
</g>
</svg>
