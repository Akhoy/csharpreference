<svg viewBox="0 0 860 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="n1-title n1-desc">
  <title id="n1-title">The N+1 problem: one query for the list, then one more per row</title>
  <desc id="n1-desc">Loading 5 orders costs one query. Then accessing each order's customer inside a loop, with lazy loading or a per-item query, costs five more round trips — six total instead of one. Projecting the customer name into the same query, or batching with a WHERE IN clause, keeps it at a single round trip.</desc>
  <defs>
    <style>
      <![CDATA[
      :root { --bg:#ffffff; --ink:#1b1f27; --dim:#6b7280;
        --a1:#512bd4; --a2:#a993ff; --bad1:#c03a46; --bad2:#f0727b; --ok1:#22845a; --ok2:#4cc58a; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#14161c; --ink:#eef0f6; --dim:#9aa3b2; }
      }
      text { font-family: ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif; fill: var(--ink); }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .dim { fill: var(--dim); }
      .grp { opacity: 0; }
      @media (prefers-reduced-motion: reduce) { .grp { opacity: 1; animation: none !important; } }
      .step { animation: fade 12s ease-in-out infinite; }
      @keyframes fade { 0% { opacity:0; transform: translateY(6px);} 6%,100% { opacity:1; transform: translateY(0);} }

      .box { rx: 7; stroke-width: 2; fill: none; }
      .boxOk { stroke: var(--ok1); } .boxBad { stroke: var(--bad1); }
      @media (prefers-color-scheme: dark) { .boxOk { stroke: var(--ok2); } .boxBad { stroke: var(--bad2); } }

      .queryBad { animation: popbad 12s steps(5) infinite; }
      @keyframes popbad { 0% { opacity: 0; } 42% { opacity: 0; } 46% { opacity: 1; } 100% { opacity: 1; } }
      .q1 { animation-delay: 2.4s; } .q2 { animation-delay: 2.9s; } .q3 { animation-delay: 3.4s; } .q4 { animation-delay: 3.9s; } .q5 { animation-delay: 4.4s; }

      .okflash { animation: popok 12s ease-in-out infinite; animation-delay: 8s; }
      @keyframes popok { 0%,0% { opacity: 0; } 2% { opacity: 1; } 100% { opacity: 1; } }
      ]]>
    </style>
  </defs>

  <rect width="860" height="400" fill="var(--bg)"/>
  <text x="20" y="28" font-size="15" font-weight="600">Loading 5 orders and each one's customer name</text>

  <!-- Bad path -->
  <g class="grp step" style="animation-delay:0s">
    <text x="20" y="60" font-size="13" font-weight="600">Lazy loading / query inside a loop</text>
    <rect class="box boxOk" x="20" y="75" width="220" height="36"/>
    <text x="34" y="98" class="mono" font-size="12">1. SELECT * FROM Orders</text>
  </g>
  <g class="grp step" style="animation-delay:1.2s">
    <text x="20" y="135" class="dim" font-size="12">foreach order: order.Customer.Name</text>
  </g>
  <g class="queryBad q1"><rect class="box boxBad" x="20" y="150" width="220" height="30"/><text x="32" y="170" class="mono" font-size="11">2. SELECT Customer WHERE Id=1</text></g>
  <g class="queryBad q2"><rect class="box boxBad" x="20" y="184" width="220" height="30"/><text x="32" y="204" class="mono" font-size="11">3. SELECT Customer WHERE Id=2</text></g>
  <g class="queryBad q3"><rect class="box boxBad" x="20" y="218" width="220" height="30"/><text x="32" y="238" class="mono" font-size="11">4. SELECT Customer WHERE Id=3</text></g>
  <g class="queryBad q4"><rect class="box boxBad" x="20" y="252" width="220" height="30"/><text x="32" y="272" class="mono" font-size="11">5. SELECT Customer WHERE Id=4</text></g>
  <g class="queryBad q5"><rect class="box boxBad" x="20" y="286" width="220" height="30"/><text x="32" y="306" class="mono" font-size="11">6. SELECT Customer WHERE Id=5</text></g>
  <text x="20" y="330" class="mono" font-size="12" fill="var(--bad1)">6 round trips for 5 orders</text>

  <!-- Good path -->
  <g class="grp step" style="animation-delay:6.5s">
    <text x="470" y="60" font-size="13" font-weight="600">Projection: Select(o =&gt; new { o.Id, o.Customer.Name })</text>
    <rect class="box boxOk" x="470" y="75" width="340" height="36"/>
    <text x="484" y="98" class="mono" font-size="12">1 query — JOIN done inside SQL</text>
  </g>
  <g class="okflash">
    <text x="470" y="140" class="mono" font-size="12" fill="var(--ok1)">SELECT o.Id, c.Name FROM Orders o</text>
    <text x="470" y="158" class="mono" font-size="12" fill="var(--ok1)">JOIN Customers c ON c.Id = o.CustomerId</text>
    <text x="470" y="190" class="mono" font-size="13" fill="var(--ok1)" font-weight="600">1 round trip, regardless of row count</text>
  </g>

  <text x="20" y="380" font-size="12" class="dim">The fix isn't fewer customers — it's letting the database do the join instead of your loop.</text>
</svg>
