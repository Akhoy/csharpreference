<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="t d">
<title id="t">Virtual dispatch vs hiding, through a method table</title>
<desc id="d">A variable of static type A holding a B instance. Calling the virtual method Who looks up B's actual method table at runtime and finds B's override, printing B. Calling the non-virtual Plain method is decided entirely at compile time from the variable's static type A, with no table lookup at all, printing A even though the real object is a B.</desc>
<style>
  <![CDATA[
  .bg   { fill:#f5f6f9; }
  .cap  { font: 600 13px "IBM Plex Sans","Segoe UI",sans-serif; fill:#171b26; }
  .sub  { font: 400 12.5px "IBM Plex Sans","Segoe UI",sans-serif; fill:#646c7e; }
  .lblw { font: 600 11.5px "JetBrains Mono",monospace; fill:#ffffff; }
  .tag  { font: 700 10.5px "JetBrains Mono",monospace; letter-spacing:.04em; fill:#646c7e; }
  .code { font: 500 13px "JetBrains Mono",monospace; fill:#171b26; }
  .obj  { fill:#512bd4; }
  .mt   { fill:#2457c5; }
  .slot { fill:#22845a; }
  .direct{ fill:#b06f08; }
  .edge { stroke:#dde1ea; stroke-width:1.5; fill:none; }
  @media (prefers-color-scheme: dark) {
    .bg   { fill:#0d0f15; }
    .cap  { fill:#e7e9f0; }
    .sub  { fill:#959db0; }
    .tag  { fill:#959db0; }
    .code { fill:#e7e9f0; }
    .obj  { fill:#a993ff; }
    .mt   { fill:#7ea6ff; }
    .slot { fill:#4cc58a; }
    .direct{ fill:#e6a83a; }
    .edge { stroke:#282d3b; }
  }
  .grp { opacity:0; }
  @media (prefers-reduced-motion: reduce) { .grp { opacity:1; animation:none !important; } }

  @keyframes inSetup { 0%,2%{opacity:0;} 6%,94%{opacity:1;} 98%,100%{opacity:0;} }
  @keyframes inWho   { 0%,20%{opacity:0;} 25%,56%{opacity:1;} 60%,100%{opacity:0;} }
  @keyframes inPlain { 0%,62%{opacity:0;} 67%,94%{opacity:1;} 98%,100%{opacity:0;} }

  .setup { animation: inSetup 11s ease-in-out infinite; }
  .who   { animation: inWho 11s ease-in-out infinite; }
  .plain { animation: inPlain 11s ease-in-out infinite; }
  ]]>
</style>

<rect class="bg" x="0" y="0" width="640" height="380"/>
<text class="cap" x="24" y="28">A x = new B();  — same variable, two different lookup paths</text>
<text class="sub" x="24" y="46">x.Who() is virtual: it checks the REAL object's table. x.Plain() isn't: the compiler already decided.</text>

<g class="grp setup">
  <rect class="obj" x="40" y="70" width="140" height="40" rx="8"/>
  <text class="lblw" x="110" y="94" text-anchor="middle">object on heap: B</text>

  <path class="edge" d="M110 110 L110 140" marker-end="url(#a1)"/>
  <rect class="mt" x="40" y="140" width="140" height="70" rx="8"/>
  <text class="lblw" x="110" y="160" text-anchor="middle">B's method table</text>
  <rect class="slot" x="52" y="170" width="116" height="26" rx="5"/>
  <text class="lblw" x="110" y="188" text-anchor="middle" font-size="10.5">Who → B.Who()</text>
</g>

<!-- x.Who() virtual path -->
<g class="grp who">
  <text class="code" x="330" y="90">x.Who()</text>
  <path class="edge" d="M330 100 Q 230 130 180 183" marker-end="url(#a2)"/>
  <text class="tag" x="330" y="115">1. follow object's REAL table</text>
  <text class="tag" x="330" y="132">2. jump to B.Who()</text>
  <rect class="slot" x="300" y="150" width="140" height="40" rx="8"/>
  <text class="lblw" x="370" y="175" text-anchor="middle">prints "B"</text>
</g>

<!-- x.Plain() non-virtual path -->
<g class="grp plain">
  <text class="code" x="330" y="250">x.Plain()</text>
  <text class="tag" x="330" y="268">decided at COMPILE TIME from</text>
  <text class="tag" x="330" y="283">x's static type (A) — no table lookup</text>
  <rect class="direct" x="300" y="300" width="200" height="40" rx="8"/>
  <text class="lblw" x="400" y="325" text-anchor="middle">calls A.Plain() directly — prints "A"</text>
</g>

<defs>
  <marker id="a1" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto"><path d="M0,0 L4,6 L8,0 Z" fill="#2457c5"/></marker>
  <marker id="a2" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto"><path d="M0,0 L4,6 L8,0 Z" fill="#22845a"/></marker>
</defs>
</svg>
