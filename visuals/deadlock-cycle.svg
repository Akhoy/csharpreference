<svg viewBox="0 0 820 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dl-title dl-desc">
  <title id="dl-title">How two transactions deadlock each other</title>
  <desc id="dl-desc">Transaction A locks row 1 then waits for row 2. Transaction B locks row 2 then waits for row 1. Each holds what the other needs, so neither can proceed, and the database detects the cycle and kills one transaction as the deadlock victim.</desc>
  <defs>
    <style>
      <![CDATA[
      :root { --bg:#ffffff; --ink:#1b1f27; --dim:#6b7280;
        --a1:#512bd4; --a2:#a993ff; --b1:#2457c5; --b2:#7ea6ff; --bad1:#c03a46; --bad2:#f0727b; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#14161c; --ink:#eef0f6; --dim:#9aa3b2; }
      }
      text { font-family: ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif; fill: var(--ink); }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .dim { fill: var(--dim); }
      .grp { opacity: 0; }
      @media (prefers-reduced-motion: reduce) { .grp { opacity: 1; animation: none !important; } }
      .boxA { stroke: var(--a1); fill: none; stroke-width: 2.5; }
      .boxB { stroke: var(--b1); fill: none; stroke-width: 2.5; }
      @media (prefers-color-scheme: dark) { .boxA { stroke: var(--a2); } .boxB { stroke: var(--b2); } }

      .step { animation: fade 11s ease-in-out infinite; }
      @keyframes fade { 0% { opacity:0; } 6%,76% { opacity:1; } 86%,100% { opacity: 1; } }
      .t1 { animation-delay: 0s; }
      .t2 { animation-delay: 1.6s; }
      .t3 { animation-delay: 3.2s; }
      .t4 { animation-delay: 4.8s; }

      .waitline { stroke: var(--dim); stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
      .waitpulse { animation: waitfade 11s ease-in-out infinite; animation-delay: 4.8s; }
      @keyframes waitfade { 0%,42% { opacity: 0; } 46%,80% { opacity: 1; } 90%,100% { opacity: 0; } }

      .victim { animation: killflash 11s ease-in-out infinite; animation-delay: 6.4s; }
      @keyframes killflash { 0%,56% { opacity: 0; } 60%,90% { opacity: 1; } 100% { opacity: 1; } }
      ]]>
    </style>
    <marker id="dlArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/>
    </marker>
  </defs>

  <rect width="820" height="380" fill="var(--bg)"/>
  <text x="20" y="28" font-size="15" font-weight="600">Two transactions, each waiting on what the other already holds</text>

  <!-- Row boxes -->
  <rect x="330" y="60" width="150" height="50" rx="8" class="boxA"/>
  <text x="405" y="90" text-anchor="middle" class="mono" font-size="13">Row 1</text>
  <rect x="330" y="270" width="150" height="50" rx="8" class="boxB"/>
  <text x="405" y="300" text-anchor="middle" class="mono" font-size="13">Row 2</text>

  <!-- Tx A -->
  <g class="grp step t1">
    <rect x="40" y="60" width="200" height="50" rx="8" class="boxA"/>
    <text x="60" y="90" class="mono" font-size="13" fill="var(--a1)">Tx A: locks Row 1</text>
  </g>
  <g class="grp step t2">
    <text x="40" y="150" class="mono" font-size="12" fill="var(--a1)">Tx A: wants Row 2 → waits</text>
    <path class="waitline waitpulse" d="M 140,110 L 405,270" marker-end="url(#dlArrow)"/>
  </g>

  <!-- Tx B -->
  <g class="grp step t3">
    <rect x="580" y="270" width="200" height="50" rx="8" class="boxB"/>
    <text x="600" y="300" class="mono" font-size="13" fill="var(--b1)">Tx B: locks Row 2</text>
  </g>
  <g class="grp step t4">
    <text x="580" y="230" class="mono" font-size="12" fill="var(--b1)">Tx B: wants Row 1 → waits</text>
    <path class="waitline waitpulse" d="M 680,270 L 480,85" marker-end="url(#dlArrow)"/>
  </g>

  <g class="victim">
    <rect x="40" y="60" width="200" height="50" rx="8" fill="var(--bad1)" opacity="0.85"/>
    <text x="60" y="90" class="mono" font-size="13" fill="#fff">Tx A killed: error 1205</text>
  </g>

  <text x="20" y="360" font-size="12" class="dim">Neither transaction can proceed — the database detects the cycle and kills one as the deadlock victim.</text>
</svg>
