<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="t d">
<title id="t">Span slices the original memory; Split copies new strings</title>
<desc id="d">The same source string is handled two ways. Split allocates a brand new array and copies each field into a brand new string, four separate allocations. A Span over the same characters never copies anything: slicing just narrows the pointer-and-length window it uses to view the original memory, which is why it allocates nothing.</desc>
<style>
  <![CDATA[
  .bg   { fill:#f5f6f9; }
  .cap  { font: 600 13px "IBM Plex Sans","Segoe UI",sans-serif; fill:#171b26; }
  .sub  { font: 400 12.5px "IBM Plex Sans","Segoe UI",sans-serif; fill:#646c7e; }
  .lblw { font: 600 11px "JetBrains Mono",monospace; fill:#ffffff; }
  .tag  { font: 700 10.5px "JetBrains Mono",monospace; letter-spacing:.04em; fill:#646c7e; }
  .src  { fill:#512bd4; }
  .copy { fill:#b06f08; }
  .view { fill:none; stroke:#22845a; stroke-width:3; }
  .edge { stroke:#dde1ea; stroke-width:1.5; fill:none; }
  @media (prefers-color-scheme: dark) {
    .bg   { fill:#0d0f15; }
    .cap  { fill:#e7e9f0; }
    .sub  { fill:#959db0; }
    .tag  { fill:#959db0; }
    .src  { fill:#a993ff; }
    .copy { fill:#e6a83a; }
    .view { stroke:#4cc58a; }
    .edge { stroke:#282d3b; }
  }
  .grp { opacity:0; }
  @media (prefers-reduced-motion: reduce) { .grp { opacity:1; animation:none !important; } .slide { animation:none !important; transform:translateX(0); } }

  @keyframes inSplit { 0%,2%{opacity:0;} 6%,46%{opacity:1;} 50%,100%{opacity:0;} }
  @keyframes inSpan  { 0%,52%{opacity:0;} 56%,96%{opacity:1;} 100%{opacity:0;} }
  @keyframes slide   { 0%{transform:translateX(0);} 40%{transform:translateX(130px);} 70%{transform:translateX(280px);} 100%{transform:translateX(280px);} }

  .split { animation: inSplit 10s ease-in-out infinite; }
  .span  { animation: inSpan 10s ease-in-out infinite; }
  .slide { animation: slide 10s ease-in-out infinite; }
  ]]>
</style>

<rect class="bg" x="0" y="0" width="640" height="380"/>
<text class="cap" x="24" y="28">"2026-10-27,ORD-1042,149.90,EUR" — one source string, two ways to read field 3</text>

<rect class="src" x="40" y="46" width="560" height="34" rx="6"/>
<text class="lblw" x="320" y="68" text-anchor="middle">the original string, one block of characters, allocated once</text>

<g class="grp split">
  <text class="sub" x="24" y="110">line.Split(',') — allocates a NEW array, plus a NEW string for every field</text>
  <rect class="copy" x="60" y="130" width="110" height="34" rx="6"/>
  <text class="lblw" x="115" y="152" text-anchor="middle">"2026-10-27" (new)</text>
  <rect class="copy" x="190" y="130" width="100" height="34" rx="6"/>
  <text class="lblw" x="240" y="152" text-anchor="middle">"ORD-1042" (new)</text>
  <rect class="copy" x="310" y="130" width="90" height="34" rx="6"/>
  <text class="lblw" x="355" y="152" text-anchor="middle">"149.90" (new)</text>
  <rect class="copy" x="420" y="130" width="70" height="34" rx="6"/>
  <text class="lblw" x="455" y="152" text-anchor="middle">"EUR" (new)</text>
  <text class="tag" x="60" y="190">4 field copies + 1 array = 5 allocations, every single call</text>
</g>

<g class="grp span">
  <text class="sub" x="24" y="110">span[(i2+1)..i3] — just a narrower pointer+length over the SAME characters</text>
  <g class="slide">
    <rect class="view" x="310" y="46" width="90" height="34" rx="4"/>
  </g>
  <text class="tag" x="60" y="190">the window moves; the characters underneath never move, never copy, never allocate</text>
  <text class="sub" x="60" y="225">decimal.Parse(span[...]) reads straight out of the window above — zero new allocations</text>
</g>

<text class="tag" x="24" y="330">Microsoft Learn: Memory and Span usage guidelines</text>
</svg>
